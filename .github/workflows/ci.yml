name: CI Dashboard OTV
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master, 'feature/**', 'fix/**', 'release/**']
permissions:
  contents: read
jobs:
  quality:
    name: TypeScript, domain, SQL and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Measure quality and reject complexity regressions
        run: npm run --silent quality:metrics:check > quality-metrics.json
      - name: Validate quality artifact as JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('quality-metrics.json','utf8'))"
      - name: Upload quality measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-otv-quality-${{ github.run_id }}
          path: web/quality-metrics.json
          if-no-files-found: warn
          retention-days: 14
      - run: npm audit --audit-level=high
      - name: Check release documentation
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          test -f ../documentacion/REQUISITOS.md
          test -f ../documentacion/FLUJO_GIT_Y_RELEASES.md
          if [[ "$BRANCH" == release/v* ]]; then
            version="${BRANCH#release/}"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test -f "../documentacion/releases/${version}.md"
          fi

  visual:
    name: Visual QA (Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - name: Upload visual report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-otv-visual-${{ github.run_id }}
          path: |
            web/test-results/visual
            web/playwright-report
          if-no-files-found: warn
          retention-days: 14
